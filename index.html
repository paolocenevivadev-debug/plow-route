<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plow Route</title>
<meta name="description" content="Storm-day route planner and service log for snow plowing.">
<meta name="theme-color" content="#0E1820">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plow Route">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="col">
    <div class="mark"><img src="icon-192.png" alt=""></div>
    <div class="brand"><b id="brand-name">Plow Route</b><span id="brand-sub"></span></div>
    <span id="pill" class="pill" hidden></span>
    <button class="iconbtn" data-act="settings" aria-label="Settings">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </div>
</header>

<main id="view"><div class="col"><div class="card empty"><b>Plow Route</b><p class="muted">Loading your route…</p></div></div></main>

<section id="mapwrap" hidden aria-label="Route map">
  <div id="map"></div>
  <div class="mapbar">
    <div class="mapinfo" id="mapinfo"></div>
    <button class="mapbtn" data-act="fit" aria-label="Show the whole route">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="mapbtn" data-act="locate" aria-label="Show where I am">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
</section>

<nav class="tabs" aria-label="Sections">
  <div class="col">
    <a href="#storm" data-tab="storm"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M4.9 6.5l14.2 11M4.9 17.5l14.2-11"/><path d="M9.5 3.5 12 6l2.5-2.5M9.5 20.5 12 18l2.5 2.5"/></svg>Storm</a>
    <a href="#map" data-tab="map"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</a>
    <a href="#clients" data-tab="clients"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Clients</a>
    <a href="#records" data-tab="records"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.5-2h5L16 5"/></svg>Records</a>
  </div>
</nav>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="restore" accept=".zip,application/zip" hidden>
<div id="layer"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="leaflet.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
